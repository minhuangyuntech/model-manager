name: Desktop

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test-and-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
            artifact: desktop/LocalModelManager-macos.zip
          - os: windows-2022
            bundle: nsis
            artifact: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test local scanner
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test refresh comparisons
        run: node --test tests/inventory.test.mjs
      - name: Build desktop bundle
        run: npx --yes @tauri-apps/cli@2.12.6 build --ci --bundles ${{ matrix.bundle }} -- --locked
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent 'src-tauri/target/release/bundle/macos/Local Model Manager.app' LocalModelManager-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
